<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0d1b2e;
    --navy-card: #162035;
    --navy-border: #1e2d45;
    --red: #d42020;
    --cream: #f5f0e8;
    --cream-dark: #ede7dd;
    --white: #ffffff;
    --gray: #8a9ab0;
    --text-dark: #0d1b2e;
    --font-head: 'Barlow Condensed', sans-serif;
    --font-body: 'Barlow', sans-serif;
  }

  html { scroll-behavior: smooth; }
  body { font-family: var(--font-body); background: var(--cream); color: var(--text-dark); overflow-x: hidden; }

  /* NAV */
  nav {
    background: var(--navy);
    padding: 0 40px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;

    border-bottom: 2px solid var(--red);

  .nav-logo {

    font-weight: 800;
    font-size: 20px;
    color: var(--white);
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
  }
  .nav-logo span { color: var(--red); }
  .nav-links { display: flex; align-items: center; gap: 32px; }
  .nav-links a {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--white);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--red); }
  .btn-red {
    background: var(--red);
    color: var(--white);
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .btn-red:hover { background: #b81818; }
  .btn-outline {
    background: transparent;
    color: var(--white);
    border: 2px solid rgba(255,255,255,0.4);
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 20px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.2s, background 0.2s;
  }
  .btn-outline:hover { border-color: var(--white); background: rgba(255,255,255,0.06); }
  .btn-outline-dark {
    background: transparent;
    color: var(--navy);
    border: 2px solid var(--navy);
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 20px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .btn-outline-dark:hover { background: rgba(0,0,0,0.06); }

    background: var(--navy);
    padding: 80px 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    min-height: calc(100vh - 60px);
    max-height: 800px;

  .hero-badge {

    text-transform: uppercase;

  /* REVIEWS */
  .reviews-section {
    background: var(--cream);
    padding: 56px 40px;

function MapSection() {
  const mapRef = useRef(null);
  const leafletMap = useRef(null);
  const cityMarkers = useRef({});
  const [activeCity, setActiveCity] = useState(null);
  const activeCityRef = useRef(null);

  useEffect(() => {
    if (!mapRef.current || leafletMap.current) return;
    const map = L.map(mapRef.current, { zoomControl: true }).setView([47.45, -122.15], 9);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);
    L.circle([47.6062, -122.3321], { color: '#d42020', fillColor: '#d42020', fillOpacity: 0.06, weight: 2, radius: 60000 }).addTo(map);
    cities.forEach(city => {
      const m = L.circleMarker([city.lat, city.lng], { color: '#0d1b2e', fillColor: '#ffffff', fillOpacity: 1, radius: 8, weight: 2 })
        .addTo(map).bindPopup(`<b>${city.name}</b>`);
      cityMarkers.current[city.name] = m;
    });
    leafletMap.current = map;
  }, []);

  const focusCity = (city) => {
    if (activeCityRef.current && cityMarkers.current[activeCityRef.current]) {
      cityMarkers.current[activeCityRef.current].setStyle({ color: '#0d1b2e', fillColor: '#ffffff', fillOpacity: 1 });
    }
    activeCityRef.current = city.name;
    setActiveCity(city.name);
    if (leafletMap.current) {
      const map = leafletMap.current;
      map.invalidateSize();
      map.flyTo([city.lat, city.lng], 13, { animate: true, duration: 0.6 });
      const marker = cityMarkers.current[city.name];
      if (marker) {
        marker.setStyle({ color: '#a01010', fillColor: '#d42020', fillOpacity: 1 });
        setTimeout(() => marker.openPopup(), 650);
      }
    }
  };

  const blurCity = (city) => {
    const marker = cityMarkers.current[city.name];
    if (marker) marker.setStyle({ color: '#0d1b2e', fillColor: '#ffffff', fillOpacity: 1 });
    activeCityRef.current = null;
    setActiveCity(null);
    if (leafletMap.current) {
      leafletMap.current.flyTo([47.45, -122.15], 9, { animate: true, duration: 0.6 });
    }
  };

  return (
    <section className="map-section" id="map">
      <span className="eyebrow">Map</span>
      <h2 className="section-headline" style={{maxWidth: 680}}>Currently Serving Seattle and Nearby Seattle Area Cities.</h2>
      <p style={{fontSize:15, color:'rgba(255,255,255,0.6)', lineHeight:1.7, marginBottom:28, maxWidth:'100%'}}>Our current coverage is centered around Seattle, WA. If your pickup or delivery is outside this area, send a quote request and we will confirm availability.</p>
      <div className="map-grid">
        <div className="city-list">
          {cities.map(c => (
            <div
              key={c.name}
              className={`city-item${activeCity === c.name ? ' active' : ''}`}
              onClick={() => focusCity(c)}
              onMouseEnter={() => focusCity(c)}
              onMouseLeave={() => blurCity(c)}
            >{c.name}</div>
          ))}
        </div>
        <div className="map-container">
          <div id="leaflet-map" ref={mapRef}></div>
        </div>
      </div>
    </section>
  );
}

function QuoteForm() {
  const [form, setForm] = useState({ name:'', phone:'', email:'', pickup:'', dropoff:'', date:'', items:'', notes:'' });
  const [submitted, setSubmitted] = useState(false);
  const [sending, setSending] = useState(false);
  const set = (k, v) => setForm(f => ({...f, [k]: v}));

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSending(true);

    try {
      const res = await fetch('https://formsubmit.co/ajax/admin@nxt-gentransportation.com', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          _subject: `New Moving Quote — ${form.name} (${form.phone})`,
          _replyto: form.email,
          _template: 'table',
          Name: form.name,
          Phone: form.phone,
          Email: form.email,
          'Pickup Address': form.pickup,
          'Drop-off Address': form.dropoff,
          'Move Date': form.date || 'Not specified',
          'Items to Move': form.items,
          'Access Notes': form.notes || 'None'
        })
      });

      if (!res.ok) throw new Error(`Submit error ${res.status}`);

      try {
        const submission = {
          id: Date.now(),
          date: new Date().toLocaleDateString(),
          name: form.name,
          email: form.email,
          phone: form.phone,
          from: form.pickup,
          to: form.dropoff,
          moveDate: form.date || '—',
          items: form.items,
          status: 'NEW',
          done: false
        };
        const existing = JSON.parse(localStorage.getItem('nxtgen_submissions') || '[]');
        localStorage.setItem('nxtgen_submissions', JSON.stringify([submission, ...existing]));
      } catch(_) {}

      setSubmitted(true);
    } catch (err) {
      alert('Something went wrong sending your request. Please call us directly at (206) 705-3489.');
      console.error('Quote send error:', err);
    } finally {
      setSending(false);

            <button className="btn-red" style={{marginTop: 28}} onClick={() => { setSubmitted(false); setForm({ name:'', phone:'', email:'', pickup:'', dropoff:'', date:'', items:'', notes:'' }); }}>Submit Another</button>

    } catch { return mockSubmissions; }
  });
  const [trash, setTrash] = useState(() => {
    try {
      const saved = localStorage.getItem('nxtgen_trash');
      return saved ? JSON.parse(saved) : [];
    } catch { return []; }
  });
  useEffect(() => {
    try { localStorage.setItem('nxtgen_submissions', JSON.stringify(submissions)); } catch {}
  }, [submissions]);
  useEffect(() => {
    try { localStorage.setItem('nxtgen_trash', JSON.stringify(trash)); } catch {}
  }, [trash]);
  const [activeTab, setActiveTab] = useState('submissions');

  const toggleDone = (id) => {
    setSubmissions(ss => ss.map(s => s.id === id ? {...s, done: !s.done} : s));
  };

  const moveToTrash = (id) => {
    const item = submissions.find(s => s.id === id);
    if (item) {
      setSubmissions(ss => ss.filter(s => s.id !== id));
      setTrash(tt => [...tt, {...item, deletedAt: new Date().toLocaleDateString()}]);
    }
  };

  const restoreFromTrash = (id) => {
    const item = trash.find(s => s.id === id);
    if (item) {
      const { deletedAt, ...restored } = item;
      setTrash(tt => tt.filter(s => s.id !== id));
      setSubmissions(ss => [...ss, restored]);
    }

  const permanentlyDelete = (id) => {

  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App() {
  const SESSION_MS = 10 * 60 * 1000;
  const [page, setPage] = useState(() => {
    try {
      const ts = parseInt(localStorage.getItem('nxtgen_admin_session') || '0', 10);
      if (ts && Date.now() - ts < SESSION_MS) return 'admin-dashboard';
    } catch {}
    return 'home';
  });

  const startSession = () => {
    try { localStorage.setItem('nxtgen_admin_session', String(Date.now())); } catch {}
    setPage('admin-dashboard');
  };
  const endSession = () => {
    try { localStorage.removeItem('nxtgen_admin_session'); } catch {}
    setPage('admin-login');
  };
  const goHome = () => setPage('home');

  useEffect(() => {
    if (page !== 'admin-dashboard') return;
    const refresh = () => {
      try { localStorage.setItem('nxtgen_admin_session', String(Date.now())); } catch {}
    };
    const events = ['mousemove', 'keydown', 'click', 'scroll', 'visibilitychange'];
    events.forEach(e => window.addEventListener(e, refresh));
    const checkExpiry = setInterval(() => {
      try {
        const ts = parseInt(localStorage.getItem('nxtgen_admin_session') || '0', 10);
        if (!ts || Date.now() - ts >= SESSION_MS) {
          clearInterval(checkExpiry);
          endSession();
        }
      } catch {}
    }, 30000);
    refresh();
    return () => {
      events.forEach(e => window.removeEventListener(e, refresh));
      clearInterval(checkExpiry);
    };
  }, [page]);

  return (
    <>
      {page === 'home' && <LandingPage onAdminClick={() => setPage('admin-login')} />}
      {page === 'admin-login' && <AdminLogin onLogin={startSession} onBack={goHome} />}
      {page === 'admin-dashboard' && <AdminDashboard onBack={goHome} onSignOut={endSession} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
